[package]
name = "brewlet"
version = "0.1.0"
description = "Free & open-source macOS GUI for Homebrew"
edition = "2021"
rust-version = "1.85"

[lib]
name = "brewlet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
